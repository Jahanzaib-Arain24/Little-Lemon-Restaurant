<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Circular Mediterranean green background -->
  <circle cx="50" cy="50" r="48" fill="#495E57" />
  
  <!-- Lemon Stem and Leaves -->
  <path d="M 50 24 C 50 16 50 14 50 12" stroke="#2B3A35" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Right Leaf -->
  <path d="M 50 20 C 58 14 68 18 68 26 C 60 30 52 26 50 20 Z" fill="#6B8E23" />
  <path d="M 50 20 Q 60 22 66 25" stroke="#495E57" stroke-width="1" fill="none"/>
  
  <!-- Left Leaf -->
  <path d="M 50 22 C 42 16 32 20 32 28 C 40 32 48 28 50 22 Z" fill="#7BA05B" />
  <path d="M 50 22 Q 40 24 34 27" stroke="#495E57" stroke-width="1" fill="none"/>

  <!-- Lemon Body -->
  <!-- Top/Bottom pointy curves with wide middle -->
  <path d="M 50 24 
           C 68 30 76 50 72 68 
           C 68 82 56 88 50 90 
           C 44 88 32 82 28 68 
           C 24 50 32 30 50 24 Z" 
        fill="#F4CE14" />
        
  <!-- Subtle inner lemon highlight -->
  <path d="M 48 28 
           C 60 34 66 48 64 62 
           C 61 72 52 78 48 80" 
        stroke="#FCE883" 
        stroke-width="3" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.6"/>
</svg>
